<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timo Music</title>
  <link rel="stylesheet" href="./assets/styles.css">
  <script src="https://accounts.google.com/gsi/client" async></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>🎵 Timo Music</h1>
    <p>Sign in to continue</p>

    <section class="panel">
      <h2>FabTune Token</h2>
      <input id="token" type="password"
             placeholder="Enter FabTune token">
      <button id="tokenLogin">Connect Token</button>
      <p id="tokenStatus">Enter your token to try connecting.</p>

      <div id="googleFallback" hidden>
        <hr>
        <h3>Token connection unavailable?</h3>
        <p>Try signing in with Google.</p>
        <div id="googleButton"></div>
        <p id="googleStatus"></p>
      </div>
    </section>

    <section id="music" class="panel" hidden>
      <h2>Welcome to Timo Music!</h2>
      <p id="accessStatus"></p>
      <p>Music playback will be available when a supported music API is connected.</p>
      <button id="logout">Sign out</button>
    </section>
  </main>
</body>
</html>
