<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timo Music</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <header>
    <h1>🎵 Timo Music</h1>
    <p>Your music, your token.</p>
  </header>

  <main>
    <section class="panel">
      <h2>FabTune Token Login</h2>
      <input id="token" type="password" placeholder="Paste your FabTune token">
      <button id="toggle" type="button">Show</button>
      <button id="login" type="button">Connect</button>
      <button id="logout" type="button">Remove Token</button>
      <p id="status">Enter your token to continue.</p>
    </section>

    <section class="panel" id="music" hidden>
      <h2>Search Music</h2>
      <form id="searchForm">
        <input id="query" type="search" placeholder="Song or artist name" required>
        <button type="submit">Search</button>
      </form>
      <p id="message">Music API needs to be configured.</p>
      <div id="results"></div>
      <h3 id="title">Nothing playing</h3>
      <audio id="player" controls></audio>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
